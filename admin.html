<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול משתמשים</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f0f2f5; min-height:100vh; padding:20px; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
    max-width:640px; margin:0 auto 24px; }
  .topbar h1 { font-size:1.3rem; font-weight:700; }
  .link-btn { background:none; border:none; color:#007aff;
    font-size:0.9rem; cursor:pointer; padding:6px 10px; border-radius:8px; }
  .link-btn:hover { background:#f0f0f0; }

  .badge { display:inline-flex; align-items:center; justify-content:center;
    background:#ff3b30; color:white; border-radius:20px; font-size:0.75rem;
    font-weight:700; min-width:20px; height:20px; padding:0 6px;
    margin-right:4px; vertical-align:middle; }

  .card { background:white; border-radius:16px; padding:24px;
    max-width:640px; margin:0 auto 20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.07); }
  .card h3 { font-size:1rem; font-weight:600; margin-bottom:20px;
    display:flex; align-items:center; gap:8px; }
  label { display:block; font-size:0.85rem; color:#555;
    font-weight:500; margin-bottom:6px; }
  input, select { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0;
    border-radius:12px; font-size:1rem; outline:none; margin-bottom:14px;
    background:white; }
  input:focus, select:focus { border-color:#007aff; }
  .btn-primary { width:100%; padding:14px; background:#007aff; color:white;
    border:none; border-radius:12px; font-size:1rem; font-weight:600;
    cursor:pointer; margin-top:4px; }
  .btn-primary:hover { background:#0066dd; }

  /* User rows */
  .user-row { display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid #f0f0f0; }
  .user-row:last-child { border-bottom:none; }
  .user-info .name { font-weight:600; font-size:0.95rem; }
  .user-info .meta { color:#888; font-size:0.82rem; margin-top:2px; }
  .role-badge { padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:600; }
  .role-admin    { background:#fff3cd; color:#856404; }
  .role-manager  { background:#cce5ff; color:#004085; }
  .role-security { background:#d4edda; color:#155724; }

  /* Pending rows */
  .pending-row { padding:16px 0; border-bottom:1px solid #f0f0f0; }
  .pending-row:last-child { border-bottom:none; }
  .pending-header { margin-bottom:12px; }
  .pending-info .name { font-weight:600; font-size:0.95rem; color:#1a1a1a; }
  .pending-info .meta { color:#888; font-size:0.82rem; margin-top:3px; }
  .pending-info .email { color:#007aff; font-size:0.82rem; margin-top:2px; }
  .pending-info .time { color:#aaa; font-size:0.78rem; margin-top:2px; }
  .pending-actions { display:grid; grid-template-columns:1fr auto auto; gap:8px;
    align-items:center; }
  .pending-role-select { padding:8px 12px; border:1.5px solid #e0e0e0;
    border-radius:10px; font-size:0.9rem; outline:none; background:white;
    margin-bottom:0; width:100%; }
  .pending-role-select:focus { border-color:#007aff; }
  .btn-approve { padding:10px 16px; background:#34c759; color:white; border:none;
    border-radius:10px; font-size:0.9rem; font-weight:600; cursor:pointer;
    white-space:nowrap; }
  .btn-approve:hover { background:#28a745; }
  .btn-reject { padding:10px 14px; background:#ff3b30; color:white; border:none;
    border-radius:10px; font-size:0.9rem; font-weight:600; cursor:pointer; }
  .btn-reject:hover { background:#dc2626; }
  .empty-msg { color:#aaa; text-align:center; padding:20px 0; font-size:0.9rem; }

  /* Audit log */
  .log-scroll { max-height:400px; overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:#ddd transparent; }
  .log-scroll::-webkit-scrollbar { width:4px; }
  .log-scroll::-webkit-scrollbar-thumb { background:#ddd; border-radius:4px; }
  .log-entry { display:flex; gap:12px; padding:12px 0;
    border-bottom:1px solid #f5f5f5; align-items:flex-start; }
  .log-entry:last-child { border-bottom:none; }
  .log-icon { width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; flex-shrink:0; }
  .log-icon.green { background:#e6ffee; }
  .log-icon.red   { background:#ffeeee; }
  .log-body { flex:1; min-width:0; }
  .log-main { font-size:0.9rem; color:#1a1a1a; line-height:1.5; }
  .log-main strong { color:#007aff; }
  .log-main .arrow { color:#aaa; margin:0 4px; }
  .log-main .emp { color:#1a1a1a; font-weight:600; }
  .log-status-green { color:#006600; font-weight:600; }
  .log-status-red   { color:#990000; font-weight:600; }
  .log-location { font-size:0.8rem; color:#888; margin-top:2px; }
  .log-time { font-size:0.78rem; color:#bbb; margin-top:2px; }
  .log-refresh { display:flex; justify-content:flex-end; margin-bottom:12px; }
  .btn-refresh { background:none; border:1.5px solid #e0e0e0; color:#555;
    border-radius:10px; padding:6px 14px; font-size:0.85rem; cursor:pointer; }
  .btn-refresh:hover { background:#f0f0f0; }

  .error { background:#fff0f0; color:#cc0000; border-radius:10px;
    padding:12px; font-size:0.9rem; margin-top:12px; display:none; }
  .success { background:#f0fff4; color:#006600; border-radius:10px;
    padding:12px; font-size:0.9rem; margin-top:12px; display:none; }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚙️ ניהול משתמשים</h1>
  <div>
    <button class="link-btn" onclick="window.location.href='dashboard.html'">⬅ חזרה</button>
    <button class="link-btn" onclick="api.logout()">יציאה</button>
  </div>
</div>

<!-- Pending approvals -->
<div class="card">
  <h3>
    🔔 בקשות הצטרפות ממתינות
    <span class="badge" id="pending-badge" style="display:none">0</span>
  </h3>
  <div id="pending-list"><div class="empty-msg">טוען...</div></div>
</div>

<!-- Add user manually -->
<div class="card">
  <h3>➕ הוספת משתמש ידנית</h3>
  <label>שם משתמש</label>
  <input type="text" id="new-username" placeholder="שם משתמש">
  <label>סיסמה</label>
  <input type="password" id="new-password" placeholder="סיסמה (מינימום 8 תווים)">
  <label>תפקיד</label>
  <select id="new-role">
    <option value="security">אבטחה (Security)</option>
    <option value="manager">מנהל (Manager)</option>
    <option value="admin">מנהל מערכת (Admin)</option>
  </select>
  <label>מסגרת (למנהלים בלבד)</label>
  <input type="text" id="new-dept" placeholder="שם המסגרת">
  <button class="btn-primary" onclick="addUser()">הוסף משתמש</button>
  <div class="error"   id="add-error"></div>
  <div class="success" id="add-success"></div>
</div>

<!-- Existing users -->
<div class="card">
  <h3>👥 משתמשים קיימים</h3>
  <div id="user-list">טוען...</div>
</div>

<!-- Audit log -->
<div class="card">
  <h3>📋 יומן פעולות אחרון</h3>
  <div class="log-refresh">
    <button class="btn-refresh" onclick="loadAuditLog()">🔄 רענן</button>
  </div>
  <div class="log-scroll" id="audit-log">
    <div class="empty-msg">טוען...</div>
  </div>
</div>

<script type="module">
  import { api, requireAuth } from "./js/api.js";
  window.api = api;
  requireAuth("admin");

  const ROLE_LABELS = { admin:"מנהל מערכת", manager:"מנהל", security:"אבטחה" };

  // ── Pending ───────────────────────────────────────────────
  async function loadPending() {
    const list  = document.getElementById("pending-list");
    const badge = document.getElementById("pending-badge");
    try {
      const data  = await api.getPending();
      const items = data.pending || [];

      if (!items.length) {
        list.innerHTML = '<div class="empty-msg">אין בקשות ממתינות ✅</div>';
        badge.style.display = "none";
        return;
      }

      badge.textContent  = items.length;
      badge.style.display = "inline-flex";

      list.innerHTML = items.map(p => `
        <div class="pending-row" id="pending-row-${p.rowIndex}">
          <div class="pending-header">
            <div class="pending-info">
              <div class="name">👤 ${p.fullName}</div>
              <div class="meta">שם משתמש: <strong>${p.username}</strong></div>
              <div class="email">✉️ ${p.email}</div>
              <div class="meta">תפקיד מבוקש:
                <span class="role-badge role-${p.requestedRole}">
                  ${ROLE_LABELS[p.requestedRole] || p.requestedRole}
                </span>
              </div>
              <div class="time">⏱ ${p.timestamp}</div>
            </div>
          </div>
          <div class="pending-actions">
            <select class="pending-role-select" id="role-select-${p.rowIndex}">
              <option value="security" ${p.requestedRole==="security"?"selected":""}>אבטחה</option>
              <option value="manager"  ${p.requestedRole==="manager" ?"selected":""}>מנהל</option>
              <option value="admin"    ${p.requestedRole==="admin"   ?"selected":""}>מנהל מערכת</option>
            </select>
            <button class="btn-approve"
              onclick="approvePending(${p.rowIndex}, '${p.username}')">
              ✅ אשר
            </button>
            <button class="btn-reject"
              onclick="rejectPending(${p.rowIndex}, '${p.username}')">
              ❌
            </button>
          </div>
        </div>`).join("");
    } catch(e) {
      list.innerHTML = `<div class="empty-msg">שגיאה: ${e.message}</div>`;
    }
  }

  window.approvePending = async function(rowIndex, username) {
    const approvedRole = document.getElementById(`role-select-${rowIndex}`).value;
    const dept = approvedRole === "manager"
      ? prompt(`מה המסגרת של ${username}? (השאר ריק לכל המסגרות)`) || ""
      : "";
    try {
      await api.approvePending(rowIndex, approvedRole, dept);
      showToast(`✅ ${username} אושר כ-${ROLE_LABELS[approvedRole]}`);
      loadPending();
      loadUsers();
    } catch(e) {
      showToast(`❌ שגיאה: ${e.message}`);
    }
  };

  window.rejectPending = async function(rowIndex, username) {
    if (!confirm(`לדחות את הבקשה של ${username}?`)) return;
    try {
      await api.rejectPending(rowIndex);
      showToast(`🗑 בקשת ${username} נדחתה`);
      loadPending();
    } catch(e) {
      showToast(`❌ שגיאה: ${e.message}`);
    }
  };

  // ── Users ─────────────────────────────────────────────────
  async function loadUsers() {
    try {
      const data = await api.getUsers();
      const list = document.getElementById("user-list");
      if (!data.users.length) {
        list.innerHTML = '<div class="empty-msg">אין משתמשים</div>';
        return;
      }
      list.innerHTML = data.users.map(u => `
        <div class="user-row">
          <div class="user-info">
            <div class="name">${u.username}</div>
            <div class="meta">${u.dept || "כל המסגרות"}</div>
          </div>
          <span class="role-badge role-${u.role}">
            ${ROLE_LABELS[u.role] || u.role}
          </span>
        </div>`).join("");
    } catch(e) {
      document.getElementById("user-list").textContent = "שגיאה בטעינה";
    }
  }

  window.addUser = async function() {
    const username = document.getElementById("new-username").value.trim();
    const password = document.getElementById("new-password").value;
    const role     = document.getElementById("new-role").value;
    const dept     = document.getElementById("new-dept").value.trim();
    const errEl    = document.getElementById("add-error");
    const okEl     = document.getElementById("add-success");
    errEl.style.display = "none";
    okEl.style.display  = "none";
    if (!username || !password) {
      errEl.textContent = "נא למלא שם משתמש וסיסמה";
      errEl.style.display = "block"; return;
    }
    if (password.length < 8) {
      errEl.textContent = "הסיסמה חייבת להכיל לפחות 8 תווים";
      errEl.style.display = "block"; return;
    }
    try {
      await api.createUser(username, password, role, dept);
      okEl.textContent = `✅ המשתמש "${username}" נוצר בהצלחה`;
      okEl.style.display = "block";
      document.getElementById("new-username").value = "";
      document.getElementById("new-password").value = "";
      document.getElementById("new-dept").value = "";
      loadUsers();
    } catch(e) {
      errEl.textContent = e.message || "שגיאה ביצירת משתמש";
      errEl.style.display = "block";
    }
  };

  // ── Audit log ─────────────────────────────────────────────
  window.loadAuditLog = async function() {
    const container = document.getElementById("audit-log");
    container.innerHTML = '<div class="empty-msg">טוען...</div>';
    try {
      const data = await api.getAuditLog();
      const logs = data.logs || [];

      if (!logs.length) {
        container.innerHTML = '<div class="empty-msg">אין פעולות עדיין</div>';
        return;
      }

      container.innerHTML = logs.map(log => {
        const isGreen  = log.status.toLowerCase() === "green";
        const icon     = isGreen ? "✅" : "🔴";
        const iconClass = isGreen ? "green" : "red";
        const statusLabel = isGreen ? "נוכח" : "לא נוכח";
        const locationText = log.location ? ` (${log.location})` : "";

        return `
          <div class="log-entry">
            <div class="log-icon ${iconClass}">${icon}</div>
            <div class="log-body">
              <div class="log-main">
                <strong>${log.user}</strong>
                <span class="arrow">›</span>
                <span class="emp">${log.employee}</span>
                —
                <span class="${isGreen ? "log-status-green" : "log-status-red"}">
                  ${statusLabel}${locationText}
                </span>
              </div>
              <div class="log-time">🕐 ${log.timestamp}</div>
            </div>
          </div>`;
      }).join("");

    } catch(e) {
      container.innerHTML = `<div class="empty-msg">שגיאה: ${e.message}</div>`;
    }
  };

  function showToast(msg) {
    const t = document.createElement("div");
    t.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
      background:#1a1a1a;color:white;padding:12px 24px;border-radius:12px;
      font-size:0.95rem;z-index:100;white-space:nowrap;`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  loadPending();
  loadUsers();
  loadAuditLog();
  setInterval(loadPending, 30000);
  setInterval(loadAuditLog, 30000);
</script>
</body>
</html>

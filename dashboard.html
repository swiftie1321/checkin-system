<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סריקת נוכחות</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f0f2f5; min-height:100vh; padding:20px; }

  /* Topbar */
  .topbar { display:flex; justify-content:space-between; align-items:center;
    max-width:480px; margin:0 auto 12px; flex-wrap:wrap; gap:8px; }
  .topbar h2 { font-size:1.1rem; font-weight:600; }
  .topbar-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .link-btn { background:none; border:none; color:#007aff;
    font-size:0.85rem; cursor:pointer; padding:6px 10px; border-radius:8px; }
  .link-btn:hover { background:#f0f0f0; }

  /* Temp access banner */
  .temp-banner { max-width:480px; margin:0 auto 12px;
    background:linear-gradient(135deg,#5856d6,#007aff);
    border-radius:14px; padding:12px 16px;
    display:none; align-items:center; justify-content:space-between; gap:8px; }
  .temp-banner.show { display:flex; }
  .temp-banner-text { color:white; font-size:0.85rem; font-weight:600; }
  .temp-timer { color:rgba(255,255,255,0.9); font-size:0.8rem;
    background:rgba(255,255,255,0.2); padding:4px 10px;
    border-radius:20px; white-space:nowrap; }

  /* Warning flash */
  @keyframes warningFlash {
    0%,100% { background:#f0f2f5; }
    25%,75%  { background:#ff9500; }
    50%      { background:#ff6b00; }
  }
  body.warning-flash { animation: warningFlash 0.8s ease 3; }

  /* Cards */
  .card { background:white; border-radius:20px; padding:24px;
    max-width:480px; margin:0 auto 16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08); }
  h3 { font-size:1rem; font-weight:600; color:#333; margin-bottom:16px; }
  #reader { width:100%; border-radius:12px; overflow:hidden; }
  .scan-btn { width:100%; padding:16px; background:#007aff; color:white;
    border:none; border-radius:14px; font-size:1.1rem; font-weight:600;
    cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:8px; margin-top:12px; }
  .scan-btn:disabled { opacity:0.6; }

  /* Employee card */
  .emp-card { display:none; }
  .emp-header { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .emp-avatar { width:52px; height:52px; border-radius:50%;
    background:#e8f0fe; display:flex; align-items:center;
    justify-content:center; font-size:1.5rem; flex-shrink:0; }
  .emp-name { font-size:1.2rem; font-weight:700; color:#1a1a1a; }
  .emp-dept { color:#666; font-size:0.88rem; margin-top:2px; }
  .emp-meta { color:#888; font-size:0.8rem; margin-top:3px; }
  .status-badge { display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:20px; font-size:0.88rem; font-weight:600; }
  .status-green { background:#e6ffee; color:#006600; }
  .status-red   { background:#ffeeee; color:#990000; }

  label.loc-label { display:block; font-size:0.85rem; color:#555;
    font-weight:500; margin:14px 0 6px; }
  select { width:100%; padding:11px 14px; border:1.5px solid #e0e0e0;
    border-radius:12px; font-size:1rem; outline:none; background:white;
    margin-bottom:12px; }
  select:focus { border-color:#007aff; }

  .action-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn-present { padding:14px; background:#34c759; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-absent  { padding:14px; background:#ff3b30; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-present:disabled,.btn-absent:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-cancel  { width:100%; padding:12px; background:none; border:1.5px solid #ddd;
    border-radius:12px; font-size:0.9rem; color:#555; cursor:pointer; margin-top:8px; }

  /* History section */
  .history-section { margin-top:16px; border-top:1px solid #f0f0f0; padding-top:14px; }
  .history-title { font-size:0.82rem; font-weight:600; color:#888;
    margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }
  .history-item { display:flex; align-items:center; gap:10px;
    padding:8px 0; border-bottom:1px solid #f8f8f8; }
  .history-item:last-child { border-bottom:none; }
  .history-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .history-dot.green   { background:#34c759; }
  .history-dot.red     { background:#ff3b30; }
  .history-dot.warning { background:#ff9500; }
  .history-body { flex:1; min-width:0; }
  .history-status { font-size:0.85rem; font-weight:600; color:#1a1a1a; }
  .history-meta { font-size:0.78rem; color:#aaa; margin-top:1px; }
  .no-history { font-size:0.85rem; color:#bbb; text-align:center; padding:8px 0; }

  /* Warning toast (orange) */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    color:white; padding:12px 24px; border-radius:12px;
    font-size:0.95rem; opacity:0; transition:opacity 0.3s; pointer-events:none;
    white-space:nowrap; z-index:100; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }
  .toast.normal  { background:#1a1a1a; }
  .toast.warning { background:#ff9500; font-weight:600; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.5); z-index:200;
    justify-content:center; align-items:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:white; border-radius:20px; padding:28px 24px;
    width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .modal h3 { font-size:1.1rem; font-weight:700; margin-bottom:20px; color:#1a1a1a; }
  .modal label { display:block; font-size:0.85rem; color:#555;
    font-weight:500; margin-bottom:6px; }
  .modal input { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0;
    border-radius:12px; font-size:1rem; outline:none; margin-bottom:12px; }
  .modal input:focus { border-color:#007aff; }
  .modal textarea { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0;
    border-radius:12px; font-size:1rem; outline:none; margin-bottom:12px;
    resize:vertical; min-height:80px; font-family:inherit; }
  .modal textarea:focus { border-color:#007aff; }
  .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
  .btn-confirm { padding:14px; background:#007aff; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-confirm:disabled { opacity:0.5; }
  .btn-dismiss { padding:14px; background:#f0f2f5; color:#333; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }

  /* Pending message banner */
  .msg-banner { max-width:480px; margin:0 auto 12px; border-radius:14px;
    padding:14px 16px; font-size:0.9rem; font-weight:500; display:none; }
  .msg-banner.show { display:block; }
  .msg-banner.info    { background:#e8f4fd; color:#0066cc; border:1px solid #b3d9f7; }
  .msg-banner.success { background:#e6ffee; color:#006600; border:1px solid #99ddaa; }
  .msg-banner.error   { background:#fff0f0; color:#cc0000; border:1px solid #ffbbbb; }
</style>
</head>
<body>

<!-- Pending message banner -->
<div class="msg-banner" id="msg-banner"></div>

<div class="topbar">
  <h2 id="greeting">שלום</h2>
  <div class="topbar-right">
    <button class="link-btn" id="stats-btn" style="display:none"
      onclick="window.location.href='stats.html'">📊 סטטיסטיקה</button>
    <button class="link-btn" id="admin-btn" style="display:none"
      onclick="window.location.href='admin.html'">⚙️ ניהול</button>
    <button class="link-btn" id="temp-req-btn" style="display:none"
      onclick="openTempModal()">🔓 גישה זמנית</button>
    <button class="link-btn" id="add-user-btn" style="display:none"
      onclick="window.location.href='add-user.html'">➕ משתמש</button>
    <button class="link-btn" onclick="api.logout()">יציאה</button>
  </div>
</div>

<!-- Temp access timer banner -->
<div class="temp-banner" id="temp-banner">
  <div class="temp-banner-text">🔓 גישה זמנית פעילה — כל המסגרות</div>
  <div class="temp-timer" id="temp-timer">--:--:--</div>
</div>

<!-- Scanner card -->
<div class="card" id="scanner-card">
  <h3>📷 סריקת QR</h3>
  <div id="reader"></div>
  <button class="scan-btn" id="scan-btn" onclick="startScan()">
    📷 התחל סריקה
  </button>
</div>

<!-- Employee card -->
<div class="card emp-card" id="emp-card">
  <div class="emp-header">
    <div class="emp-avatar">👤</div>
    <div>
      <div class="emp-name" id="emp-name"></div>
      <div class="emp-dept" id="emp-dept"></div>
      <div class="emp-meta" id="emp-meta"></div>
    </div>
  </div>

  <div style="margin-bottom:12px">
    סטטוס נוכחי: <span class="status-badge" id="status-badge"></span>
  </div>

  <label class="loc-label">📍 מיקום (בעת יציאה)</label>
  <select id="location-select">
    <option value="">בחר מיקום...</option>
  </select>

  <div class="action-row">
    <button class="btn-present" id="btn-present" onclick="updateStatus('Green')">✅ נוכח</button>
    <button class="btn-absent"  id="btn-absent"  onclick="updateStatus('Red')">🔴 לא נוכח</button>
  </div>
  <button class="btn-cancel" onclick="resetScanner()">ביטול</button>

  <!-- History -->
  <div class="history-section" id="history-section" style="display:none">
    <div class="history-title">היסטוריית כניסות/יציאות אחרונות</div>
    <div id="history-list"></div>
  </div>
</div>

<!-- Temp access request modal -->
<div class="modal-overlay" id="temp-modal">
  <div class="modal">
    <h3>🔓 בקשת גישה זמנית</h3>
    <p style="color:#666;font-size:0.9rem;margin-bottom:16px;">
      גישה לכל המסגרות למשך 24 שעות מרגע האישור
    </p>
    <label>סיבת הבקשה</label>
    <textarea id="temp-reason" placeholder="תאר את הצורך בגישה זמנית..."></textarea>
    <div class="modal-actions">
      <button class="btn-confirm" id="temp-submit-btn" onclick="submitTempRequest()">שלח בקשה</button>
      <button class="btn-dismiss" onclick="closeTempModal()">ביטול</button>
    </div>
    <div id="temp-modal-status" style="margin-top:12px;font-size:0.9rem;text-align:center;color:#555;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { api, requireAuth } from "./js/api.js";
  window.api = api;

  const user = requireAuth("security");
  if (!user) throw new Error("not authed");

  document.getElementById("greeting").textContent = `שלום, ${user.username}`;

  // Show pending message if any
  const pendingMsg = localStorage.getItem("pendingMessage");
  if (pendingMsg) {
    const banner = document.getElementById("msg-banner");
    banner.textContent = pendingMsg;
    const isSuccess = pendingMsg.startsWith("✅");
    const isError   = pendingMsg.startsWith("❌");
    banner.className = `msg-banner show ${isSuccess?"success":isError?"error":"info"}`;
    localStorage.removeItem("pendingMessage");
    setTimeout(() => banner.classList.remove("show"), 6000);
  }

  // Role-based UI
  if (user.role === "security" || user.role === "admin") {
    document.getElementById("stats-btn").style.display = "block";
  }
  if (user.role === "admin") {
    document.getElementById("admin-btn").style.display = "block";
  }
  if (user.role === "manager" || user.role === "admin") {
    document.getElementById("add-user-btn").style.display = "block";
  }
  if (user.role === "manager") {
    document.getElementById("temp-req-btn").style.display = "block";
    checkTempAccess();
  }

  // Hide Red button for security
  if (user.role === "security") {
    document.getElementById("btn-absent").style.display = "none";
  }

  // Load locations
  api.getLocations().then(data => {
    const sel = document.getElementById("location-select");
    data.locations.forEach(loc => {
      const opt = document.createElement("option");
      opt.value = loc; opt.textContent = loc;
      sel.appendChild(opt);
    });
  });

  // ── Temp access timer ─────────────────────────────────────
  let tempTimerInterval = null;

  async function checkTempAccess() {
    try {
      const data = await api.getTempAccessMine();
      if (data.status === "active" && data.msRemaining > 0) {
        showTempBanner(data.msRemaining);
        document.getElementById("temp-req-btn").style.display = "none";
      } else if (data.status === "pending") {
        document.getElementById("temp-req-btn").textContent = "⏳ ממתין לאישור";
        document.getElementById("temp-req-btn").disabled = true;
      }
    } catch {}
  }

  function showTempBanner(msRemaining) {
    const banner = document.getElementById("temp-banner");
    banner.classList.add("show");
    if (tempTimerInterval) clearInterval(tempTimerInterval);
    let remaining = msRemaining;
    function tick() {
      if (remaining <= 0) {
        clearInterval(tempTimerInterval);
        banner.classList.remove("show");
        document.getElementById("temp-req-btn").style.display = "block";
        document.getElementById("temp-req-btn").textContent = "🔓 גישה זמנית";
        document.getElementById("temp-req-btn").disabled = false;
        return;
      }
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      document.getElementById("temp-timer").textContent =
        `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      remaining -= 1000;
    }
    tick();
    tempTimerInterval = setInterval(tick, 1000);
  }

  // ── Temp access modal ─────────────────────────────────────
  window.openTempModal = function() {
    document.getElementById("temp-reason").value = "";
    document.getElementById("temp-modal-status").textContent = "";
    document.getElementById("temp-modal").classList.add("show");
  };

  window.closeTempModal = function() {
    document.getElementById("temp-modal").classList.remove("show");
  };

  window.submitTempRequest = async function() {
    const reason = document.getElementById("temp-reason").value.trim();
    const btn    = document.getElementById("temp-submit-btn");
    const status = document.getElementById("temp-modal-status");
    if (!reason) {
      status.textContent = "נא לציין סיבה";
      status.style.color = "#ff3b30"; return;
    }
    btn.disabled = true; btn.textContent = "שולח...";
    status.textContent = ""; 
    try {
      await api.requestTempAccess(reason);
      status.textContent = "✅ הבקשה נשלחה — ממתינה לאישור מנהל";
      status.style.color = "#34c759";
      document.getElementById("temp-req-btn").textContent = "⏳ ממתין לאישור";
      document.getElementById("temp-req-btn").disabled = true;
      setTimeout(closeTempModal, 2000);
    } catch(e) {
      status.textContent = e.message || "שגיאה בשליחה";
      status.style.color = "#ff3b30";
      btn.disabled = false; btn.textContent = "שלח בקשה";
    }
  };

  // ── Scanner ───────────────────────────────────────────────
  let scanner = null;
  let currentEmployee = null;
  let scanning = false;

  window.startScan = async function() {
    if (scanning) return;
    scanning = true;
    document.getElementById("scan-btn").disabled = true;
    document.getElementById("scan-btn").textContent = "סורק...";
    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:{ width:250, height:250 } },
        onScanSuccess
      );
    } catch(e) {
      showToast("לא ניתן לגשת למצלמה", "normal");
      scanning = false;
      resetScanner();
    }
  };

  async function onScanSuccess(text) {
    if (!scanning) return;
    scanning = false;
    try { await scanner.stop(); } catch {}
    scanner = null;

    currentEmployee = null;
    document.getElementById("btn-present").disabled = false;
    document.getElementById("btn-absent").disabled = false;
    document.getElementById("location-select").value = "";

    let code = text;
    try {
      const u = new URL(text);
      code = u.searchParams.get("code") || text;
    } catch {}

    try {
      const emp = await api.getEmployee(code);
      currentEmployee = emp;
      showEmployeeCard(emp);
    } catch(e) {
      showToast(e.message || "קוד לא נמצא", "normal");
      resetScanner();
    }
  }

  function showEmployeeCard(emp) {
    document.getElementById("scanner-card").style.display = "none";
    const card = document.getElementById("emp-card");
    card.style.display = "block";

    document.getElementById("emp-name").textContent = emp.name;
    document.getElementById("emp-dept").textContent =
      `${emp.department} — ${emp.service}`;
    document.getElementById("emp-meta").textContent =
      emp.lastUpdated ? `עדכון אחרון: ${emp.lastUpdated}` : "";

    const badge    = document.getElementById("status-badge");
    const isGreen  = emp.status.toLowerCase() === "green";
    badge.textContent = isGreen ? "נוכח" : "לא נוכח";
    badge.className   = "status-badge " + (isGreen ? "status-green" : "status-red");

    if (emp.location) {
      document.getElementById("location-select").value = emp.location;
    }

    // Show history
    showHistory(emp.history || []);
  }

  function showHistory(history) {
    const section = document.getElementById("history-section");
    const list    = document.getElementById("history-list");
    if (!history.length) {
      section.style.display = "block";
      list.innerHTML = '<div class="no-history">אין היסטוריה עדיין</div>';
      return;
    }
    section.style.display = "block";
    list.innerHTML = history.map(h => {
      const isGreen   = h.status.toLowerCase() === "green";
      const isWarning = h.type === "WARNING";
      const dotClass  = isWarning ? "warning" : isGreen ? "green" : "red";
      const label     = isWarning ? "⚠️ אזהרה" : isGreen ? "✅ כניסה" : "🔴 יציאה";
      const loc       = h.location ? ` • ${h.location}` : "";
      return `
        <div class="history-item">
          <div class="history-dot ${dotClass}"></div>
          <div class="history-body">
            <div class="history-status">${label}${loc}</div>
            <div class="history-meta">${h.timestamp} • ${h.user}</div>
          </div>
        </div>`;
    }).join("");
  }

  window.updateStatus = async function(newStatus) {
    const location = document.getElementById("location-select").value;
    if (newStatus === "Red" && !location) {
      showToast("נא לבחור מיקום בעת יציאה", "normal");
      return;
    }
    document.getElementById("btn-present").disabled = true;
    document.getElementById("btn-absent").disabled = true;
    try {
      const result = await api.updateStatus(currentEmployee.rowIndex, newStatus, location);

      // Warning: employee already Green, security scanning entry again
      if (result.warning) {
        document.body.classList.add("warning-flash");
        showToast("⚠️ " + result.message, "warning");
        setTimeout(() => {
          document.body.classList.remove("warning-flash");
          resetScanner();
        }, 3000);
        return;
      }

      showToast(newStatus === "Green" ? "✅ נוכחות עודכנה" : "🔴 יציאה עודכנה", "normal");
      setTimeout(resetScanner, 1500);
    } catch(e) {
      showToast(e.message || "שגיאה בעדכון", "normal");
      document.getElementById("btn-present").disabled = false;
      document.getElementById("btn-absent").disabled = false;
    }
  };

  window.resetScanner = function() {
    currentEmployee = null;
    scanning = false;
    document.getElementById("emp-card").style.display = "none";
    document.getElementById("scanner-card").style.display = "block";
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scan-btn").disabled = false;
    document.getElementById("scan-btn").innerHTML = "📷 התחל סריקה";
    document.getElementById("location-select").value = "";
    document.getElementById("btn-present").disabled = false;
    document.getElementById("btn-absent").disabled = false;
    document.getElementById("history-section").style.display = "none";
    if (scanner) { try { scanner.stop(); } catch {} scanner = null; }
  };

  function showToast(msg, type = "normal") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove("show"), type === "warning" ? 3500 : 2500);
  }
</script>
</body>
</html>

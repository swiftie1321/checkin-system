<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סריקת נוכחות</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f0f2f5; min-height:100vh; padding:20px; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
    max-width:480px; margin:0 auto 20px; }
  .topbar h2 { font-size:1.1rem; font-weight:600; }
  .topbar-right { display:flex; gap:10px; }
  .link-btn { background:none; border:none; color:#007aff;
    font-size:0.9rem; cursor:pointer; padding:6px 10px; border-radius:8px; }
  .link-btn:hover { background:#f0f0f0; }
  .card { background:white; border-radius:20px; padding:28px 24px;
    max-width:480px; margin:0 auto 20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08); }
  h3 { font-size:1rem; font-weight:600; color:#333; margin-bottom:16px; }
  #reader { width:100%; border-radius:12px; overflow:hidden; }
  .scan-btn { width:100%; padding:16px; background:#007aff; color:white;
    border:none; border-radius:14px; font-size:1.1rem; font-weight:600;
    cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:8px; }
  .scan-btn:disabled { opacity:0.6; }
  .emp-card { display:none; }
  .emp-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .emp-avatar { width:56px; height:56px; border-radius:50%;
    background:#e8f0fe; display:flex; align-items:center;
    justify-content:center; font-size:1.6rem; flex-shrink:0; }
  .emp-name { font-size:1.3rem; font-weight:700; color:#1a1a1a; }
  .emp-dept { color:#666; font-size:0.9rem; margin-top:2px; }
  .status-badge { display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:20px; font-size:0.9rem; font-weight:600; }
  .status-green { background:#e6ffee; color:#006600; }
  .status-red   { background:#ffeeee; color:#990000; }
  .emp-meta { color:#888; font-size:0.82rem; margin-top:4px; }
  label.loc-label { display:block; font-size:0.85rem; color:#555;
    font-weight:500; margin:16px 0 6px; }
  select, input.field { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0;
    border-radius:12px; font-size:1rem; outline:none; background:white;
    margin-bottom:12px; }
  select:focus, input.field:focus { border-color:#007aff; }
  .action-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn-present { padding:14px; background:#34c759; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-absent  { padding:14px; background:#ff3b30; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-present:disabled,.btn-absent:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-cancel  { width:100%; padding:12px; background:none; border:1.5px solid #ddd;
    border-radius:12px; font-size:0.95rem; color:#555; cursor:pointer; margin-top:8px; }
  .btn-add { width:100%; padding:14px; background:#5856d6; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; }
  .btn-add:disabled { opacity:0.5; }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:white; padding:12px 24px; border-radius:12px;
    font-size:0.95rem; opacity:0; transition:opacity 0.3s; pointer-events:none;
    white-space:nowrap; z-index:100; }
  .toast.show { opacity:1; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.5); z-index:200;
    justify-content:center; align-items:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:white; border-radius:20px; padding:28px 24px;
    width:100%; max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .modal h3 { font-size:1.1rem; font-weight:700; margin-bottom:20px; color:#1a1a1a; }
  .modal label { display:block; font-size:0.85rem; color:#555;
    font-weight:500; margin-bottom:6px; }
  .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .btn-confirm { padding:14px; background:#007aff; color:white; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-confirm:disabled { opacity:0.5; }
  .btn-dismiss { padding:14px; background:#f0f2f5; color:#333; border:none;
    border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <h2 id="greeting">שלום</h2>
  <div class="topbar-right">
    <button class="link-btn" id="stats-btn" style="display:none"
      onclick="window.location.href='stats.html'">📊 סטטיסטיקה</button>
    <button class="link-btn" id="admin-btn" style="display:none"
      onclick="window.location.href='admin.html'">⚙️ ניהול</button>
    <button class="link-btn" onclick="api.logout()">יציאה</button>
  </div>
</div>

<!-- Scanner card -->
<div class="card" id="scanner-card">
  <h3>📷 סריקת QR</h3>
  <div id="reader"></div>
  <button class="scan-btn" id="scan-btn" onclick="startScan()">
    📷 התחל סריקה
  </button>
</div>

<!-- Employee card -->
<div class="card emp-card" id="emp-card">
  <div class="emp-header">
    <div class="emp-avatar">👤</div>
    <div>
      <div class="emp-name" id="emp-name"></div>
      <div class="emp-dept" id="emp-dept"></div>
      <div class="emp-meta" id="emp-meta"></div>
    </div>
  </div>
  <div style="margin-bottom:12px">
    סטטוס נוכחי: <span class="status-badge" id="status-badge"></span>
  </div>
  <label class="loc-label">📍 מיקום (בעת יציאה)</label>
  <select id="location-select">
    <option value="">בחר מיקום...</option>
  </select>
  <div class="action-row">
    <button class="btn-present" id="btn-present" onclick="updateStatus('Green')">✅ נוכח</button>
    <button class="btn-absent"  id="btn-absent"  onclick="updateStatus('Red')">🔴 לא נוכח</button>
  </div>
  <button class="btn-cancel" onclick="resetScanner()">ביטול</button>
</div>

<!-- Add Employee modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>➕ הוספת עובד חדש</h3>
    <label>שם מלא</label>
    <input class="field" type="text" id="new-emp-name" placeholder="שם העובד">
    <label>מסגרת</label>
    <input class="field" type="text" id="new-emp-dept" placeholder="מספר או שם מסגרת">
    <label>שירות</label>
    <input class="field" type="text" id="new-emp-svc" placeholder="מספר או שם שירות">
    <div class="modal-actions">
      <button class="btn-confirm" id="confirm-add-btn" onclick="confirmAddEmployee()">הוסף</button>
      <button class="btn-dismiss" onclick="closeAddModal()">ביטול</button>
    </div>
    <div id="add-emp-status" style="margin-top:12px;font-size:0.9rem;text-align:center;color:#555;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { api, requireAuth } from "./js/api.js";
  window.api = api;

  const user = requireAuth("security");
  if (!user) throw new Error("not authed");

  document.getElementById("greeting").textContent = `שלום, ${user.username}`;
  if (user.role === "manager" || user.role === "admin") {
    document.getElementById("stats-btn").style.display = "block";
  }
  if (user.role === "admin") {
    document.getElementById("admin-btn").style.display = "block";
    // Add employee button only for admins
    const addBtn = document.createElement("button");
    addBtn.className = "link-btn";
    addBtn.textContent = "➕ עובד";
    addBtn.onclick = () => openAddModal();
    document.getElementById("admin-btn").after(addBtn);
  }

  api.getLocations().then(data => {
    const sel = document.getElementById("location-select");
    data.locations.forEach(loc => {
      const opt = document.createElement("option");
      opt.value = loc; opt.textContent = loc;
      sel.appendChild(opt);
    });
  });

  let scanner = null;
  let currentEmployee = null;
  let scanning = false;

  window.startScan = async function() {
    if (scanning) return;
    scanning = true;
    document.getElementById("scan-btn").disabled = true;
    document.getElementById("scan-btn").textContent = "סורק...";
    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:{ width:250, height:250 } },
        onScanSuccess
      );
    } catch(e) {
      showToast("לא ניתן לגשת למצלמה");
      scanning = false;
      resetScanner();
    }
  };

  async function onScanSuccess(text) {
    // Prevent double-firing
    if (!scanning) return;
    scanning = false;

    // Stop scanner
    try { await scanner.stop(); } catch {}
    scanner = null;

    // Reset button states for fresh card
    currentEmployee = null;
    document.getElementById("btn-present").disabled = false;
    document.getElementById("btn-absent").disabled = false;
    document.getElementById("location-select").value = "";

    // Extract code
    let code = text;
    try {
      const u = new URL(text);
      code = u.searchParams.get("code") || text;
    } catch {}

    try {
      const emp = await api.getEmployee(code);
      currentEmployee = emp;
      showEmployeeCard(emp);
    } catch(e) {
      showToast(e.message || "קוד לא נמצא");
      resetScanner();
    }
  }

  function showEmployeeCard(emp) {
    document.getElementById("scanner-card").style.display = "none";
    const card = document.getElementById("emp-card");
    card.style.display = "block";
    document.getElementById("emp-name").textContent = emp.name;
    document.getElementById("emp-dept").textContent =
      `${emp.department} — ${emp.service}`;
    document.getElementById("emp-meta").textContent =
      emp.lastUpdated ? `עדכון אחרון: ${emp.lastUpdated}` : "";
    const badge = document.getElementById("status-badge");
    const isGreen = emp.status.toLowerCase() === "green";
    badge.textContent = isGreen ? "נוכח" : "לא נוכח";
    badge.className = "status-badge " + (isGreen ? "status-green" : "status-red");
    if (emp.location) {
      document.getElementById("location-select").value = emp.location;
    }
  }

  window.updateStatus = async function(newStatus) {
    const location = document.getElementById("location-select").value;
    if (newStatus === "Red" && !location) {
      showToast("נא לבחור מיקום בעת יציאה");
      return;
    }
    document.getElementById("btn-present").disabled = true;
    document.getElementById("btn-absent").disabled = true;
    try {
      await api.updateStatus(currentEmployee.rowIndex, newStatus, location);
      showToast(newStatus === "Green" ? "✅ נוכחות עודכנה" : "🔴 יציאה עודכנה");
      setTimeout(resetScanner, 1500);
    } catch(e) {
      showToast(e.message || "שגיאה בעדכון");
      document.getElementById("btn-present").disabled = false;
      document.getElementById("btn-absent").disabled = false;
    }
  };

  window.resetScanner = function() {
    currentEmployee = null;
    scanning = false;
    document.getElementById("emp-card").style.display = "none";
    document.getElementById("scanner-card").style.display = "block";
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scan-btn").disabled = false;
    document.getElementById("scan-btn").innerHTML = "📷 התחל סריקה";
    document.getElementById("location-select").value = "";
    document.getElementById("btn-present").disabled = false;
    document.getElementById("btn-absent").disabled = false;
    if (scanner) {
      try { scanner.stop(); } catch {}
      scanner = null;
    }
  };

  // ── Add Employee modal ────────────────────────────────────
  window.openAddModal = function() {
    document.getElementById("new-emp-name").value = "";
    document.getElementById("new-emp-dept").value = "";
    document.getElementById("new-emp-svc").value = "";
    document.getElementById("add-emp-status").textContent = "";
    document.getElementById("add-modal").classList.add("show");
  };

  window.closeAddModal = function() {
    document.getElementById("add-modal").classList.remove("show");
  };

  window.confirmAddEmployee = async function() {
    const name = document.getElementById("new-emp-name").value.trim();
    const dept = document.getElementById("new-emp-dept").value.trim();
    const svc  = document.getElementById("new-emp-svc").value.trim();
    const statusEl = document.getElementById("add-emp-status");
    const btn = document.getElementById("confirm-add-btn");

    if (!name || !dept || !svc) {
      statusEl.textContent = "נא למלא את כל השדות";
      statusEl.style.color = "#ff3b30";
      return;
    }

    btn.disabled = true;
    btn.textContent = "מוסיף...";
    statusEl.textContent = "מוסיף לגיליון...";
    statusEl.style.color = "#007aff";

    try {
      await api.addEmployee(name, dept, svc);
      statusEl.textContent = `✅ ${name} נוסף בהצלחה! יש לייצר QR חדש דרך הכלי.`;
      statusEl.style.color = "#34c759";
      btn.textContent = "הוסף";
      btn.disabled = false;
      document.getElementById("new-emp-name").value = "";
      document.getElementById("new-emp-dept").value = "";
      document.getElementById("new-emp-svc").value = "";
    } catch(e) {
      statusEl.textContent = e.message || "שגיאה בהוספה";
      statusEl.style.color = "#ff3b30";
      btn.textContent = "הוסף";
      btn.disabled = false;
    }
  };

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }
</script>
</body>
</html>
